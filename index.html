  note={t:"err",m:(v&&r.ok(v))?`Ви вибрали «${v}», але ще не додали її. Спершу натисніть «Додати дію», а потім «Перемістити».`:"CRM не дає перемістити звернення. "+r.txt};return render()}
 d.st=r.to;d.ago=0;d.h.push({a:"Етап → «"+SN[r.to]+"»",ago:0});note={t:"ok",m:`Переміщено в «${ACC[r.to]}».`};save();render()}
function lose(id,why){const d=D(id);d.lostAt=d.st;d.st="lost";d.why=why;d.ago=0;d.h.push({a:"Скасовано: "+why,ago:0});note={t:"ok",m:"Позначено скасованим. Причина піде у звіт."};save();render()}
function card(d){const stale=active(d)&&d.ago>STALE,nw=d.ago==0&&d.h.length==1;
 return `<button class="deal ${S.sel==d.id?"sel":""}" style="--c:${SC[d.st]}" data-deal="${d.id}"><b>${esc(d.who)}</b><span class="what">${esc(d.prod)} · ${num(d.sum)} грн</span><small><span>${esc(d.ch)}${d.type=="постійний"?" · постійний":""}</span><span class="${stale?"stale":nw?"new":""}">${stale?"без дій "+d.ago+" дн.":nw?"нове":ago(d.ago)}</span></small></button>`}
function panel(){const d=D(S.sel);if(!d)return `<section class="card" id="panel"><h3>Картка клієнта</h3><p class="note">Клацніть будь-яке звернення на дошці, щоб побачити історію клієнта й дії.</p></section>`;
 const r=NEED[d.st];
 return `<section class="card" id="panel"><p class="meta">${d.id} · <span class="pill" style="--c:${SC[d.st]}">${SN[d.st]}</span></p><h3>${esc(d.who)}</h3>
 <p class="meta">${esc(d.city)} · ${d.type=="постійний"?"постійний клієнт":"новий клієнт"} · канал: ${esc(d.ch)}<br>${esc(d.prod)} · ${num(d.sum)} грн · оплата: ${esc(d.pay)}</p>
 <b style="font-size:13px">Історія клієнта</b><ul class="hist">${d.h.map(x=>`<li>${esc(x.a)} <small>· ${ago(x.ago)}</small></li>`).join("")}</ul>
 ${active(d)?`<label>Нова дія<select id="act"><option value="">Оберіть дію…</option>${ACTS.map(a=>`<option>${a}</option>`).join("")}</select></label><label>Коментар (не обов'язково)<input id="actn" maxlength="120"></label>
 <div class="row"><button class="btn" data-add="${d.id}">Додати дію</button><button class="btn main" data-move="${d.id}">Перемістити в «${ACC[r.to]}» →</button></div>
 <label>Або скасувати<select id="why">${WHY.map(w=>`<option>${w}</option>`).join("")}</select></label>
 <button class="btn" data-lose="${d.id}">Позначити скасованим</button>`:`<p class="note">Звернення закрите — дії більше не потрібні.</p>`}
 ${note?`<div class="msg ${note.t}">${esc(note.m)}</div>`:""}</section>`}
function vBoard(){return `<div class="layout"><div class="board">${ST.map(([k,n,c])=>{const ds=S.deals.filter(d=>d.st==k);return `<section class="col" style="--c:${c}"><h2>${n}<span>${ds.length}</span></h2>${ds.map(card).join("")}</section>`}).join("")}</div>${panel()}</div>`}
function vRep(){const ds=S.deals,n=ds.length,c=ds.filter(d=>reach(d)>=1).length,o=ds.filter(d=>reach(d)>=2).length,w=ds.filter(d=>d.st=="won");const ws=w.reduce((a,d)=>a+d.sum,0);
 const pc=(a,b)=>b?Math.round(a/b*100)+"%":"—";const stale=ds.filter(d=>active(d)&&d.ago>STALE);
 const rows=[["Звернення",n,"",ST[0][2]],["Консультація",c,pc(c,n)+" від звернень",ST[1][2]],["Замовлення",o,pc(o,c)+" від консультацій",ST[2][2]],["Отримано",w.length,pc(w.length,o)+" від замовлень",ST[3][2]]];
 const by=key=>{const g={};ds.forEach(d=>{const k=d[key];g[k]=g[k]||{n:0,w:0,s:0};g[k].n++;if(d.st=="won"){g[k].w++;g[k].s+=d.sum}});return Object.entries(g)};
 const pay={};ds.filter(d=>reach(d)>=2).forEach(d=>{pay[d.pay]=pay[d.pay]||{n:0,l:0};pay[d.pay].n++;if(d.st=="lost")pay[d.pay].l++});
 const why={};ds.filter(d=>d.st=="lost").forEach(d=>why[d.why]=(why[d.why]||0)+1);
 return `<div class="kpis"><div class="kpi"><span>Отримано замовлень</span><b>${w.length}</b></div><div class="kpi"><span>Сума отриманих, грн</span><b>${num(ws)}</b></div>
 <div class="kpi"><span>Конверсія «Звернення → Отримано»</span><b>${pc(w.length,n)}</b></div><div class="kpi"><span>Завислі звернення (понад ${STALE} дні без дій)</span><b>${stale.length}</b></div></div>
 <section class="card"><h3>Воронка</h3><p class="note">Скільки звернень дійшли щонайменше до кожного етапу. Скасовані рахуються до того етапу, на якому їх скасували.</p><div class="funnel">${rows.map(r=>`<div class="fr"><span>${r[0]}</span><div><div class="bar" style="--c:${r[3]};width:${Math.max(4,r[1]/n*100)}%">${r[1]}</div></div><span class="conv">${r[2]}</span></div>`).join("")}</div></section>
 <div class="grid2"><section class="card"><h3>Канали</h3><div class="tw"><table><thead><tr><th>Канал</th><th class="num">Звернень</th><th class="num">Отримано</th><th class="num">Конверсія</th><th class="num">Сума, грн</th></tr></thead><tbody>${by("ch").map(([k,g])=>`<tr><td>${esc(k)}</td><td class="num">${g.n}</td><td class="num">${g.w}</td><td class="num">${pc(g.w,g.n)}</td><td class="num">${num(g.s)}</td></tr>`).join("")}</tbody></table></div></section>
 <section class="card"><h3>Нові й постійні клієнти</h3><div class="tw"><table><thead><tr><th>Клієнти</th><th class="num">Звернень</th><th class="num">Отримано</th><th class="num">Конверсія</th></tr></thead><tbody>${by("type").map(([k,g])=>`<tr><td>${k=="постійний"?"Постійні":"Нові"}</td><td class="num">${g.n}</td><td class="num">${g.w}</td><td class="num">${pc(g.w,g.n)}</td></tr>`).join("")}</tbody></table></div></section>
 <section class="card"><h3>Спосіб оплати</h3><p class="note">Лише оформлені замовлення: скільки з них скасували після оформлення.</p><div class="tw"><table><thead><tr><th>Оплата</th><th class="num">Оформлено</th><th class="num">Скасовано</th><th class="num">Частка</th></tr></thead><tbody>${Object.entries(pay).map(([k,g])=>`<tr><td>${esc(k)}</td><td class="num">${g.n}</td><td class="num">${g.l}</td><td class="num">${pc(g.l,g.n)}</td></tr>`).join("")}</tbody></table></div></section>
 <section class="card"><h3>Чому втрачаємо</h3><div class="tw"><table><tbody>${Object.entries(why).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join("")}</tbody></table></div></section>
 <section class="card full" style="grid-column:1/-1"><h3>Завислі звернення</h3><p class="note">Активні звернення, з якими понад ${STALE} дні нічого не робили. У роздрібі клієнт за цей час зазвичай купує деінде.</p><div class="tw"><table><tbody>${stale.map(d=>`<tr><td>${esc(d.who)}</td><td>${esc(d.prod)}</td><td>${SN[d.st]}</td><td>${esc(d.ch)}</td><td class="num">${d.ago} дн.</td></tr>`).join("")||'<tr><td class="note">Немає</td></tr>'}</tbody></table></div></section></div>`}
function render(){document.getElementById("nav").innerHTML=[["board","Воронка"],["rep","Звіт"]].map(([k,n])=>`<button role="tab" aria-selected="${tab==k}" data-tab="${k}">${n}</button>`).join("")+`<span class="spacer"></span><button data-reset="1">Почати спочатку</button>`;
 document.getElementById("view").innerHTML=tab=="board"?vBoard():vRep()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
 if(d.tab){tab=d.tab;note=null;try{history.replaceState(null,"","#"+tab)}catch(_){}return render()}
 if(d.reset){if(confirm("Почати спочатку? Усі ваші дії буде скасовано.")){S=INIT();note=null;save();render()}return}
 if(d.deal){S.sel=d.deal;note=null;save();render();if(window.innerWidth<1100){const p=document.getElementById("panel");if(p)p.scrollIntoView({behavior:"smooth",block:"start"})}return}
 if(d.add)return addAct(d.add,document.getElementById("act").value,document.getElementById("actn").value.trim());
 if(d.move)return move(d.move);if(d.lose)return lose(d.lose,document.getElementById("why").value)});
if(location.hash.slice(1)=="rep")tab="rep";
render();
</script></body></html>
